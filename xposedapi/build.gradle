plugins {
    id 'com.android.library'
}

android {
    namespace 'de.robv.android.xposed'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // No dependencies: this is a compile-time stub of the Xposed API.
    // At runtime the real classes are provided by LSPosed.
}
