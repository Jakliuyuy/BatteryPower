name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" > /dev/null
          if ! sdkmanager --install "platforms;android-36" > /dev/null 2>&1; then
            echo "android-36 unavailable, falling back to android-35"
            sdkmanager --install "platforms;android-35" > /dev/null
            sed -i 's/compileSdk 36/compileSdk 35/' app/build.gradle xposedapi/build.gradle
          fi
          if ! sdkmanager --install "build-tools;36.0.0" > /dev/null 2>&1; then
            sdkmanager --install "build-tools;35.0.0" > /dev/null
          fi
          sdkmanager --list_installed | sed -n '1,40p'

      - name: Set up Gradle 8.11.1
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Grant execute permission
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APKs
        id: collect
        run: |
          set -e
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryPower-debug
          path: out/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryPower-release
          path: out/app-release.apk
          if-no-files-found: warn

      - name: Upload mapping and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore
