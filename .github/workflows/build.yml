name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" > /dev/null
          if ! sdkmanager --install "platforms;android-36" > /dev/null 2>&1; then
            echo "android-36 unavailable, falling back to android-35"
            sdkmanager --install "platforms;android-35" > /dev/null
            sed -i 's/compileSdk 36/compileSdk 35/' app/build.gradle xposedapi/build.gradle
          fi
          if ! sdkmanager --install "build-tools;36.0.0" > /dev/null 2>&1; then
            sdkmanager --install "build-tools;35.0.0" > /dev/null
          fi
          sdkmanager --list_installed > env-installed.txt 2>&1 || true

      - name: Set up Gradle 8.11.1
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Environment summary
        run: |
          java -version 2>&1 | tee env-java.txt
          /opt/gradle-8.11.1/bin/gradle --version 2>&1 | tee env-gradle.txt

      - name: Build debug APK
        id: build_debug
        continue-on-error: true
        run: |
          set -o pipefail
          /opt/gradle-8.11.1/bin/gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee debug-build.log
          exit ${PIPESTATUS[0]}

      - name: Build release APK
        id: build_release
        continue-on-error: true
        run: |
          set -o pipefail
          /opt/gradle-8.11.1/bin/gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee release-build.log
          exit ${PIPESTATUS[0]}

      - name: Collect and inspect APKs
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/ | tee apk-list.txt
          if [ -f out/app-release.apk ]; then
            echo "=== release apk contents ===" | tee -a apk-inspect.txt
            unzip -l out/app-release.apk | head -60 | tee -a apk-inspect.txt
            echo "=== xposed_init ===" | tee -a apk-inspect.txt
            unzip -p out/app-release.apk assets/xposed_init | tee -a apk-inspect.txt
            echo "=== badging ===" | tee -a apk-inspect.txt
            AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | head -1)
            if [ -n "$AAPT" ]; then "$AAPT" dump badging out/app-release.apk | head -25 | tee -a apk-inspect.txt; fi
          fi

      - name: Publish build logs
        if: always()
        run: |
          set -e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs 2>/dev/null || git checkout ci-logs
          mkdir -p logs
          cp debug-build.log logs/debug-build.log 2>/dev/null || true
          cp release-build.log logs/release-build.log 2>/dev/null || true
          cp env-java.txt logs/env-java.txt 2>/dev/null || true
          cp env-gradle.txt logs/env-gradle.txt 2>/dev/null || true
          cp env-installed.txt logs/env-installed.txt 2>/dev/null || true
          cp apk-list.txt logs/apk-list.txt 2>/dev/null || true
          cp apk-inspect.txt logs/apk-inspect.txt 2>/dev/null || true
          git add -A logs
          git commit -m "ci logs run ${{ github.run_number }}" || echo "nothing to commit"
          git push origin HEAD:ci-logs --force

      - name: Read version
        id: version
        run: |
          NAME=$(grep -m1 "versionName" app/build.gradle | sed "s/.*versionName *'//;s/'.*//")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.build_release.outcome == 'success' || steps.build_debug.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=${{ steps.version.outputs.tag }}
          gh release create "$TAG" \
            --title "Battery Power Overlay ${{ steps.version.outputs.name }} (build ${{ github.run_number }})" \
            --notes "自动构建 #${{ github.run_number }}（commit ${{ github.sha }}）

          - app-release.apk：发布版（未配置签名 Secret 时使用 debug 签名）
          - app-debug.apk：调试版

          安装后：LSPosed 中启用模块并勾选 SystemUI，重启 SystemUI 即可在状态栏显示功率。" \
            out/app-release.apk out/app-debug.apk 2>&1 | tee release-create.log || echo "release creation skipped"

      - name: Upload debug APK
        if: steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BatteryPower-debug
          path: out/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BatteryPower-release
          path: out/app-release.apk
          if-no-files-found: warn

      - name: Fail job if a build failed
        if: steps.build_debug.outcome == 'failure' || steps.build_release.outcome == 'failure'
        run: exit 1
